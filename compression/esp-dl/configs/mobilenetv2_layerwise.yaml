# Config for MobileNetV2 model compression calibrated on birdiary dataset
batch_size: 32
img_height: 224
img_width: 224
input_model_path: model/results/training/birdiary-v4-mobilenet/birdiary-v4-mobilenet_fine_tuning.pth
dataset_path: data/data/v4/dataset/
output_path: model/results/compression/birdiary_v4_mobilenetv2/compression/
model_name: birdiary_v4_mobilenetv2_layerwise_equalization
quant_config: LayerwiseEqualization_quantization # [None, "LayerwiseEqualization_quantization", "MixedPrecision_quantization"]
# optional:
# calib_size: 1024                 # number of calibration images (default 1024)
# seed: 0                          # seed of the calibration subset (default 0)
# topk: [1, 3]                     # reported top-k accuracies (default 1)
# num_workers: 4                   # DataLoader workers (default 4)
# mixed_precision_layers: [...]    # required for MixedPrecision_quantization, see below